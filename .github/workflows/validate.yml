name: Validate assessment engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m py_compile src/*.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate demo report
        run: |
          python src/generate_report.py --data mock/assessment.json --output /tmp/assessment.html
          test -s /tmp/assessment.html
          grep -q "SoftwareOne" /tmp/assessment.html

