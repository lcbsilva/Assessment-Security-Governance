name: Validate assessment engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m py_compile src/*.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate demo report
        run: |
          python src/generate_report.py --data mock/assessment.json --output /tmp/assessment.html
          test -s /tmp/assessment.html
          grep -q "SoftwareOne" /tmp/assessment.html
      - name: Validate generated artifacts and AI guardrail
        run: |
          mkdir -p /tmp/assessment-dist /tmp/assessment-runtime
          python src/generate_report.py --data mock/assessment.json --output /tmp/assessment-dist/assessment.html
          python src/export_artifacts.py --data mock/assessment.json --output-dir /tmp/assessment-dist
          python src/ai_payload.py --data mock/assessment.json --output /tmp/assessment-runtime/ai-payload.json
          python src/validate_artifacts.py --output-dir /tmp/assessment-dist --ai-payload /tmp/assessment-runtime/ai-payload.json --assessment mock/assessment.json --output /tmp/assessment-runtime/artifact-validation.json
      - name: Run beta release gate
        run: python src/release_gate.py --data mock/assessment.json --output /tmp/assessment-runtime/release-gate.json
      - name: Validate synthetic scenario matrix
        run: bash scripts/run-synthetic-matrix.sh

  report-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Generate offline demo report
        run: python3 src/generate_report.py --data mock/assessment.json --output dist/assessment.html
      - name: Run report E2E
        run: npx playwright test
